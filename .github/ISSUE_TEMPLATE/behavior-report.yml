name: Behavior or compatibility report
description: Report a reproducible difference, regression, or platform problem
title: "[Behavior]: "
labels: [behavior]
body:
  - type: markdown
    attributes:
      value: Thank you for providing evidence. Keep original-game, reconstructed-runtime, browser, and device observations separate.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser and version, device or GPU, game language, and repository revision or release.
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario
      description: Shot type, difficulty, stage, replay filename and hash, or exact menu path.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Reference behavior and evidence
      description: Explain how the original or previous release was observed. Attach only material you may redistribute.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Evidence boundaries
      description: Name what has not been verified, such as audio, real hardware, or other shot types.

